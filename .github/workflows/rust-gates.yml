name: rust gates

on:
  workflow_dispatch: {}
  push:
    branches: ["wave2/**", "main"]
    paths: ["rust/**", "reference/**", ".gitmodules", ".github/workflows/rust-gates.yml"]
  pull_request:
    paths: ["rust/**", "reference/**", ".gitmodules"]

env:
  CARGO_TERM_COLOR: always
  # NOTE (2026-09-05): `ZENAV1_SKIP_CORPUS_TESTS` used to live HERE, at workflow
  # scope, on the premise that "no CI runner has the image corpora". That premise
  # is now false for the `gates` job: it FETCHES gb82-sc (sparse, 2.9 MB, ~2 s —
  # see "Fetch the gb82-sc screen corpus" below), so the corpus-gated cells RUN
  # there. The flag survives, still visible in the chain (workflow -> job env ->
  # test), but as a PER-JOB decision on the two pure-Rust matrix jobs, which have
  # no C oracle and no corpus. Setting it at workflow scope would silently
  # re-disable the IntraBC tier-invariance cell in the very job that can now run
  # it — the class of silent skip this file has been bitten by repeatedly.

jobs:
  gates:
    name: differential + conformance gates (x86-64)
    runs-on: ubuntu-latest
    # 120, not 90: the three screen gates wired in 2026-09-05 (IntraBC byte,
    # luma palette, bd10 panic-freedom) add ~25 min of real-corpus encoding to
    # a job that ran ~29 min. Raising the ceiling is not a relaxation — no gate
    # was made cheaper, and a timeout is a red build either way.
    timeout-minutes: 120
    env:
      # `rust/tools/lib_corpus.sh`'s `corpus_dir()` probes $ZENAV1_CORPUS_ROOT/<rel>
      # FIRST, so this one variable is what makes every `corpus_dir
      # codec-corpus/gb82-sc` call in the gate scripts resolve on this runner.
      ZENAV1_CORPUS_ROOT: ${{ github.workspace }}/corpora
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q nasm cmake ninja-build dav1d

      - name: Fetch the gb82-sc screen corpus (sparse checkout, 2.9 MB)
        # THE STEP THAT WAS MISSING. Every screen-content gate in this repo
        # resolves its corpus through `rust/tools/lib_corpus.sh::corpus_dir`,
        # which only PROBES paths — it fetches nothing. So on this runner every
        # screen cell hit `SKIP-MISSING` and the gates that depend on them were
        # never wired in at all. The visible symptom, quoted in
        # docs/INTER-ENCODE-PLAN.md §1z⁴⁰: `regression_spotcheck` reported
        # `98 / 98` here against `104 / 104` locally, naming six gb82-sc cells
        # under "SKIPPED (corpus/tool absent — these cells guarded NOTHING this
        # run)" — two of them the minimal reproducers of IntraBC bugs fixed the
        # same day. A green run said nothing about that whole class.
        #
        # The corpus is a PUBLIC CC0 dataset (imazen/codec-corpus, gb82-sc: 10
        # screenshots, 2.9 MB). A blob-filtered sparse clone of just that one
        # directory measured 2.2 s / 6.9 MB on-disk — cheaper than the cache
        # round-trip would be, so there is no cache to go stale.
        #
        # It fails LOUDLY on a short fetch: a gate that silently loses its cells
        # is exactly what this step exists to remove, so a half-fetched corpus
        # must not be allowed to reintroduce it one image at a time.
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/corpora"
          dest="$root/codec-corpus"
          mkdir -p "$root"; rm -rf "$dest"
          ok=0
          for attempt in 1 2 3; do
            if git clone --depth 1 --filter=blob:none --sparse \
                 https://github.com/imazen/codec-corpus.git "$dest"; then
              ok=1; break
            fi
            echo "corpus clone attempt $attempt failed; retrying" >&2
            rm -rf "$dest"; sleep 5
          done
          [ "$ok" = 1 ] || { echo "FATAL: could not clone codec-corpus" >&2; exit 1; }
          git -C "$dest" sparse-checkout set gb82-sc
          n=$(ls "$dest"/gb82-sc/*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "gb82-sc PNGs fetched: $n -> $dest/gb82-sc"
          [ "$n" -eq 10 ] || { echo "FATAL: expected 10 gb82-sc PNGs, got $n" >&2; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: C oracle cache key (submodule SHA + build.rs)
        id: cref-key
        # Issue #4 invariant C: "CI caches keyed on the same SHA" as the
        # build.rs stamp. The stamp is `<submodule HEAD> <config key>`, so a
        # cache entry is valid for exactly one submodule commit and one
        # build.rs (whose CONFIG_VERSION / cmake flags define the config key).
        run: echo "sha=$(git -C reference/svt-av1 rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache the cargo-built C oracle (both variants)
        uses: actions/cache@v6
        with:
          # Only the OUTPUT dirs — lib + SvtAv1EncApp + the .zenav1-cref-stamp.
          # Deliberately NOT cbuild-static{,-hdr}: a restored ninja tree sees
          # every freshly checked-out source as newer than its objects and
          # rebuilds anyway (inside the shell tools' silent `cmake --build`
          # freshness check), which is slower than no cache at all. With no
          # build dir present those tools skip that check, and build.rs finds
          # archive + matching stamp and does nothing. Measured before this
          # step existed: 141 s per run for the C build (run 33101031800).
          path: |
            Bin/Release
            Bin/ReleaseHdr
          key: cref-v1-${{ runner.os }}-${{ steps.cref-key.outputs.sha }}-${{ hashFiles('rust/crates/svtav1-cref/build.rs') }}

      - name: Build C reference (static, the differential oracle) — cargo-driven
        working-directory: rust
        # Issue #4 invariant B: the C oracle is built by
        # crates/svtav1-cref/build.rs (both variants: Bin/Release mainline for
        # the shims and every c_parity_* test, Bin/ReleaseHdr for the
        # SVT_HDR_MODE=ON byte gates), keyed on the submodule SHA. A fresh
        # clone + `cargo test` does exactly this; running it as its own step
        # keeps a C build failure attributed to the C build, not to the first
        # test that needed it. The flags are the ones the old hand-typed cmake
        # line used (Ninja, BUILD_APPS=ON, LTO off, NATIVE off). On a cache
        # hit above this is a no-op (stamp matches); the two `ls` lines make
        # hit-vs-miss visible in the log either way.
        run: |
          cargo build -p zenav1-svt-cref
          ls -la ../Bin/Release/libSvtAv1Enc.a ../Bin/Release/.zenav1-cref-stamp
          ls -la ../Bin/ReleaseHdr/libSvtAv1Enc.a ../Bin/ReleaseHdr/.zenav1-cref-stamp

      - name: Cache libaom build (aomdec oracle)
        id: aom-cache
        uses: actions/cache@v6
        with:
          path: aom-build/aomdec
          key: aomdec-v3-${{ runner.os }}

      - name: Build aomdec (reference decoder)
        if: steps.aom-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b v3.12.1 https://aomedia.googlesource.com/aom aom-src
          cmake -S aom-src -B aom-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCONFIG_AV1_ENCODER=0 -DENABLE_TESTS=0 -DENABLE_EXAMPLES=1 \
            -DENABLE_DOCS=0 -DENABLE_TOOLS=0
          cmake --build aom-build --target aomdec

      - name: Workspace tests (differential parity suites vs C)
        working-directory: rust
        # nextest is the standard runner (faster, per-test isolation). It does
        # not run doctests; the workspace has 2 (svtav1/src/lib.rs, svtav1/src/avif.rs),
        # and `cargo test --doc` below is a guard if any are ever added.
        #
        # AOMDEC: `svtav1/tests/issue13_repro.rs` decodes its stream with the
        # reference decoder built above and compares the encoder's published
        # 10-bit recon against it. The test FAILS without a decoder (no silent
        # skip); the only sanctioned skip is ZENAV1_SKIP_DECODER_TESTS=1, set
        # by a caller, and this job has the decoder so it does not set it.
        env:
          AOMDEC: ${{ github.workspace }}/aom-build/aomdec
        run: |
          cargo nextest run --workspace --no-fail-fast
          cargo test --workspace --doc

      - name: Decode conformance — mono (aomdec + dav1d)
        working-directory: rust
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" DAV1D="$(command -v dav1d)" \
            ./tools/decode_conformance.sh target/dc-mono

      - name: Decode conformance — 4:2:0 (aomdec + dav1d)
        working-directory: rust
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" DAV1D="$(command -v dav1d)" \
            ./tools/decode_conformance.sh target/dc-chroma chroma

      - name: bd10 identity (uniform, port == real aomenc at bit depth 10)
        working-directory: rust
        run: |
          ./tools/bd10_matrix.sh

      - name: bd10 non-flat identity (u16 MD path, DC-family cells)
        working-directory: rust
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/bd10_nonflat_gate.sh

      - name: bd10 NATIVE 10-bit source identity (task #6 chunk 2)
        working-directory: rust
        # Real 10-bit samples (low 2 bits SET) through the u16 entry points vs
        # the same .yuv through the C encoder. The other bd10 gates feed both
        # sides `u8 << 2`, so only this one can catch a silent truncation.
        run: |
          ./tools/bd10_hbd_src_gate.sh

      - name: SIMD tier invariance (encoder bytes must not depend on dispatch tier)
        working-directory: rust
        # The IntraBC tier cell needs the gb82-sc corpus. As of 2026-09-05 this
        # job FETCHES it (see "Fetch the gb82-sc screen corpus"), so the cell
        # RUNS here — `ZENAV1_SKIP_CORPUS_TESTS` is no longer set on this job and
        # the test resolves the corpus from $ZENAV1_CORPUS_ROOT. Before that it
        # was skipped on every run, which meant the ONLY tier coverage the
        # IntraBC path has (no synthetic content codes an IBC block) existed
        # nowhere but a dev host.
        # Encodes real cells under EVERY archmage tier and asserts identical
        # OBUs. Every byte-parity gate here assumes the port emits one bitstream
        # per input regardless of ISA; before this test nothing checked it. It
        # is also what proved C -- not the port -- is the ISA-dependent side of
        # the bd10 preset-7 screen split (docs/SUSPECTED-C-BUGS.md #9).
        run: cargo test -p zenav1-svt --test tier_invariance

      - name: peak-RSS memory sweep (port vs C, tiny -> large)
        working-directory: rust
        # Records peak RSS across sizes so a memory regression is VISIBLE. This
        # project required memory evidence from heaptrack/`time -v` in
        # ACCEPTANCE-CRITERIA.md and then never measured any, so "how much does
        # it use?" had no answer until 2026-08-16.
        #
        # Reports rather than thresholds, deliberately: RSS on a shared CI
        # runner is noisy, and a tight bound would flake and get raised until it
        # meant nothing. The committed baseline is benchmarks/mem_2026-08-16.meta
        # (port 3.5 MiB fixed + ~29-34 MiB/MP; ~122 MiB at 4 MP). Compare
        # against it by eye in the log; tighten to a gate only with a measured
        # noise floor.
        run: ./tools/mem_gate.sh 6 || true

      - name: refusal inventory is current (capability debt stays visible)
        working-directory: rust
        # Every config the encoder REFUSES, split into CONTRACT (caller misuse,
        # permanent) and CAPABILITY (not implemented -- debt). A refusal makes a
        # gap look handled: the robustness gate counts its 48 refusals as
        # PASSES, and coverage_matrix.py cannot show a refused config even as
        # a dash, because a refused config produces no cell at all. This keeps
        # the CAPABILITY list countable so it cannot quietly accrete.
        run: ./tools/refusal_inventory.sh --check

      - name: PORT-NOTE index is current (verification-debt ledger cannot drift)
        working-directory: rust
        # CLAUDE.md indexes every PORT-NOTE(unverified) marker -- the list of
        # places whose bit-exactness vs C is asserted but not proven. A
        # publication audit (issue #8) found the hand-maintained version had
        # drifted BOTH ways: under-counting some files, omitting others, and
        # still listing markers that had been cleared. It is generated now, and
        # this gate keeps it honest.
        run: ./tools/portnote_index.sh --check

      - name: regression spot-check (one cell per bug ever fixed)
        working-directory: rust
        # ~90s. Every cell is the MINIMAL REPRODUCER of a bug that once shipped,
        # so a red cell names its own regression instead of leaving someone to
        # bisect a 1000-cell sweep. Runs FIRST for that reason. The rule for
        # adding a cell (enforced in the script's header): it must have FAILED
        # before its fix and PASSED after -- a cell that never failed cannot
        # detect the regression of a fix it never witnessed.
        run: |
          RS_AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/regression_spotcheck.sh

      - name: INTER byte gate (both frames of a 2-frame low-delay P encode)
        working-directory: rust
        # THE GATE THAT WAS NEVER IN CI. `inter_byte_gate.sh`, `fctx_gate.sh`,
        # `inter_decode_gate.sh` and `inter_fh_gate.sh` guard the entire inter
        # campaign's envelope -- the number quoted in refusal 12 and in every
        # §1z entry -- and NONE of them ran here, so that envelope was held up
        # only by whoever remembered to run it locally. That is one step worse
        # than the "gate hidden behind a failing gate" trap
        # docs/WORKING-ON-THIS.md §5 records: this one was never wired at all.
        # It runs on Linux, where `-Wl,--wrap` works, against the same C oracle
        # every step above uses. ~4 min.
        #
        # It asserts a LIMIT (67 cells byte-identical on BOTH frames, as of
        # docs/INTER-ENCODE-PLAN.md §1z21) and fails if a cell regresses OR if
        # a known-open cell silently starts passing without being promoted.
        # The number in this comment is a SCOREBOARD, not the gate: the list in
        # the script is, and it is regenerated wholesale from
        # `tools/inter_byte_matrix.sh` rather than appended to.
        run: ./tools/inter_byte_gate.sh

      - name: INTER completion gate (does the port ENCODE the cell AT ALL)
        working-directory: rust
        # THE PANIC GATE THE INTER PATH NEVER HAD. `arbitrary_size_robustness.sh`
        # below is this repo's panic-freedom gate and it drives the PUBLIC API,
        # which REFUSES inter frames outright — so it cannot reach the inter
        # mode-decision path at all, and EIGHTEEN inter panics lived behind it
        # (docs/WORKING-ON-THIS.md §5: "a gate that cannot reach a feature
        # cannot guard it"). The byte gates above cannot see them either: a
        # crash and a wrong byte are different defects, and until 2026-09-02
        # the sweep scored a panic as an ordinary frame-1 divergence.
        #
        # 64 cells = 16 sizes (9 of them NOT multiples of 64, which is where
        # every one of the panics lived) x presets 6/8/10/13, 2 frames each.
        # It asserts THREE things, and the middle one is why it is here rather
        # than folded into a byte gate:
        #   * no cell crashes;
        #   * no MORE than SCAN_MAX_REFUSED cells refuse — retiring a panic by
        #     widening a refusal must fail this gate, because a refusal makes a
        #     gap look handled (docs/REFUSED-CONFIGS.md's own preamble);
        #   * at least SCAN_MIN_OK encode, and the grid actually ran.
        # The two floors are LIMITS. Moving either needs a measured reason in
        # the commit message, like the byte gate's.
        # MEASURED 15 s for the 64 cells on aarch64 (Apple M4 Pro) and 29 s for
        # ONE content class on this runner (`ubuntu-latest` x86-64, run
        # 33684184264, 21:32:54Z -> 21:33:23Z) — the sizes go to 2048 but
        # presets 6/8/10/13 are fast and a fifth of the cells refuse frame 1.
        # With the second content class below, budget ~60 s.
        # `benchmarks/gate_wallclock_ci_2026-08-27.md` is where CI step
        # durations get recorded.
        #
        # SCAN_RS_BIN points at a PLAIN release build, not `tools/identity_run`.
        # That wrapper builds `--features symtrace`, whose per-symbol
        # arithmetic-coder trace goes to stderr — MEASURED 7.2 MB for one
        # 512x512 p13 cell, and this grid's largest cells are 16x that area. It
        # is also the configuration this gate should be asking about: the
        # shipped one.
        #
        # TWO CONTENT CLASSES, and the second one is the §5 lesson applied to
        # this gate rather than quoted at it: `gradient` never arms the
        # screen-content detector, so palette and IntraBC candidates do not
        # exist in any of its cells — which is exactly how the STILL panic gate
        # sailed past two out-of-bounds panics until 2026-08-03. MEASURED
        # 2026-09-02: all five content classes the harness has
        # (gradient / screen / screenrep / uniform / diag) give the SAME
        # frontier, so it is geometry-driven —
        # SB remainder and resolution class — not content-driven. The screen
        # pass is therefore currently redundant and is here anyway, because
        # "redundant today" is not "unreachable", and a gate that cannot reach
        # a candidate set cannot guard it.
        #
        # FLOORS RAISED 2026-09-03 (52 OK / <=12 REFUSED -> 64 OK / 0 REFUSED).
        # The twelve refusals were ONE refusal - `use_ref_frame_mvs` at
        # `mfmv_level >= 2` - on every cell at 568 px and up, because
        # `mfmv_level` is 2 above 360p at preset <= M8. It was refused as
        # needing "the TPL r0 and the references' own is_mfmv_used", which C
        # only reads when `scs->tpl` is on, and this port's `aq_mode == 0`
        # refusal makes TPL structurally off. Leaving the ceiling at 12 after
        # closing it would let all twelve come back silently, which is the one
        # thing a ceiling is for. See
        # rust/benchmarks/refused_config_triage_2026-09-03.md.
        run: |
          cargo build --release -p zenav1-svt --example identity_run
          for c in gradient screen; do
            echo "=== inter completion gate: content=$c ==="
            SCAN_GATE=1 SCAN_MIN_OK=64 SCAN_MAX_REFUSED=0 SCAN_CONTENT="$c" \
              SCAN_RS_BIN="$PWD/target/release/examples/identity_run" \
              ./tools/inter_completion_scan.sh
          done

      - name: INTER decode census (does the port's stream DECODE, on all 96 cells)
        working-directory: rust
        # `inter_decode_gate.sh` asks that of FIVE named cells. This asks it of
        # all 96 — and 22 of them produce a stream `aomdec` REJECTS, which the
        # five never saw. Every one is preset 6, where the frame header carries
        # `allow_warped_motion = 1`; the port writes the two-symbol OBMC
        # alphabet where the decoder reads the three-symbol MOTION_MODES one,
        # because `av1_find_samples` is unported and `num_proj_ref` is always
        # zero (docs/INTER-ENCODE-PLAN.md §1z¹⁸). That is a CONFORMANCE defect,
        # not a quality one, and a byte gate cannot tell "wrong bytes" from
        # "bytes no decoder will accept". The 22 are pinned BY NAME: a new
        # rejection fails, and so does a pinned cell that starts decoding.
        # ~4 min.
        run: RS_AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/inter_decode_census.sh

      - name: INTER ME join gate (the port's full-pel MV against C's, per block)
        working-directory: rust
        # THE ASSERTION THAT DID NOT EXIST. docs/INTER-ENCODE-PLAN.md §1z¹⁵
        # recorded that `md_nsq_motion_search` is ported and never called, that
        # an NSQ block therefore takes the square path, and — in its own words
        # — that "no assertion in the repo can see the difference". This is
        # that assertion: it joins C's `SVT_SUBPEL_OUT` stage-0 `start=` (the
        # full-pel chain's output, NSQ search included) against the port's
        # `PMEDBG fpme=`, per (origin, shape, list, ref), and pins the two rows
        # that disagree today BY KEY. It fails on a disagreement outside that
        # pin, on a pinned row that starts agreeing, and — anti-vacuity — on a
        # run that joins zero NSQ rows at all. ~1 min.
        run: ./tools/inter_me_join_gate.sh

      - name: INTER frame-context + header + decode gates
        working-directory: rust
        # The three siblings of the byte gate, same reason. `fctx_gate` diffs
        # C's end-of-frame CDF state against the port's field by field (96
        # shared fields), `inter_fh_gate` walks frame 1's header, and
        # `inter_decode_gate` requires the two-frame stream to DECODE.
        run: |
          ./tools/fctx_gate.sh
          ./tools/inter_fh_gate.sh
          ./tools/inter_decode_gate.sh "$GITHUB_WORKSPACE/aom-build/aomdec"

      - name: 8-bit identity — EVERY preset 0..13, full qp range, 4 content classes
        working-directory: rust
        # THE gate this repo went without. `identity_matrix.sh` is a scoreboard
        # that exits 0 whatever the tally AND was never in this workflow, so
        # nothing re-checked 8-bit byte-identity -- the port's primary product
        # surface. This one exits nonzero, sweeps every preset (C clamps
        # all-intra above M9 to M9 but the PORT does not, so 10..13 are distinct
        # configurations here), carries low-q density where the structural
        # problems hide, and fails on harness errors too so a cell that could
        # not run can never look like a pass.
        #
        # CI runs the synthetic tier at one size to stay inside the job budget;
        # the dims tier (partial-SB / odd / tiny / large) and the real-corpus
        # tier are local. See the script header.
        run: |
          IF_TIER=synthetic IF_SIZES=64 ./tools/identity_full_8bit.sh \
            target/identity_full_8bit_ci.tsv

      - name: screen-content palette identity (bd8 AND bd10)
        working-directory: rust
        # The ONLY gate that reaches the palette path: every other synthetic
        # content is photographic, so the screen-content detector never arms and
        # palette stays unexercised. That blind spot let palette be gated out of
        # the bd10 funnel entirely -- the port coded zero palette blocks at 10
        # bits and emitted streams 2.0-2.5x larger than C. Self-asserts
        # anti-vacuity: a cell that codes no palette leaf FAILS.
        run: |
          ./tools/screen_palette_bd_gate.sh

      - name: screen IntraBC byte gate — gb82-sc x presets 0..4 x qp (152 cells)
        working-directory: rust
        # THE GATE THAT GUARDED A BAND NOTHING IN CI TOUCHED. Three real
        # bitstream defects closed the gb82-sc IntraBC band on 2026-09-05
        # (docs/INTER-ENCODE-PLAN.md §1z⁴⁰: the tx-depth class clamp keyed on
        # `is_inter` instead of the candidate's mode; the MD-side txfm-context
        # stamp storing block dims for a skip IntraBC winner; a palette CDF the
        # chain sim adapted where C's MD context does not). 22/100 -> 150/150.
        # None of the three had ANY CI coverage: no synthetic content arms
        # IntraBC, so the synthetic `screen`/`screenrep` cells in every other
        # gate leave the whole path dark.
        #
        # Byte-only by design — it needs no `tools/decode_diff`, so unlike
        # `screen_ibc_gate.sh` it builds anywhere the C oracle does. Its own
        # anti-vacuity (exit 3 when the port codes no IntraBC or no palette
        # block anywhere) means a misconfigured corpus makes this job RED, not
        # green: a silent skip cannot come back through this step.
        #
        # RS_AOMDEC adds the recon leg on the two record cells (the port's
        # stream must decode to the port's own final recon). Without it the leg
        # reports SKIPPED, loudly; this job has the decoder, so it runs.
        run: RS_AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/screen_ibc_byte_gate.sh

      - name: screen-content luma palette byte gate — gb82-sc x preset 6 (50 cells)
        working-directory: rust
        # The real-screenshot twin of `screen_palette_bd_gate.sh` above: that
        # one is SYNTHETIC and this one is the gb82-sc corpus, which is where
        # the two #71 palette roots (the MDS3 inter-class prune, and the
        # palette color-index rate table the port's chain sim was adapting)
        # were actually found. Anti-vacuity exit 3 if no cell codes a palette
        # block, so an absent corpus is red here too.
        run: ./tools/screen_palette_gate.sh

      - name: bd10 screen panic-freedom + decodability (gb82-sc, 60 cells)
        working-directory: rust
        # PANIC ON THE PUBLIC API, on real screen content at 10 bits: the bd10
        # leaf funnel does not port the luma palette search, and a surviving
        # palette candidate reaching `tx_unit_hbd` indexed a u16 buffer with a
        # u8 prediction (80 rs-err cells in the 2026-07-22 wider-corpus sweep,
        # all screen + bd10). This gate PINS the fix and, like the two above,
        # could not run in CI until the corpus was fetched — so it was never
        # wired in at all. It asserts panic-freedom + aomdec decodability, NOT
        # byte-identity (the bd10 palette path is unported and those streams
        # legitimately differ); a missing corpus exits 1.
        run: AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/bd10_screen_panic_gate.sh

      - name: partial-SB / odd-dimension identity (8-bit)
        working-directory: rust
        # 104 cells: partial superblocks, odd dims, straddle and both-partial
        # geometry vs the C oracle. A real pass/fail gate since it was written
        # (its last statement is `[ "$fail" -eq 0 ]`) — it was simply never
        # wired here.
        run: |
          ./tools/partial_sb_gate.sh

      - name: bd10 partial-SB identity (10-bit at non-64-aligned dims)
        working-directory: rust
        # 157 cells across BOTH bd10 level producers (preset <= 8 full-RD
        # funnel, preset >= 9 level-only re-encode post-pass). Until 2026-08-04
        # EVERY one of these was refused ("no bd10 producer is partial-SB
        # aware") — the product case for 10-bit AVIF — and no bd10 gate could
        # reach a partial superblock at all (bd10_matrix sweeps 64/128,
        # bd10_nonflat only 64x64/128x128). Also pins the residual non-flat
        # divergences self-promotingly, so a fix cannot land unnoticed and the
        # residual cannot silently grow.
        run: |
          ./tools/bd10_partial_sb_gate.sh

      - name: Alignment / stride gate (true-vs-aligned x stride x bit depth)
        working-directory: rust
        # The axis every other gate misses. `recon_parity` (432) and
        # `decode_gate_grid` (120) are entirely 64-ALIGNED SQUARES;
        # `partial_sb_gate` runs partial SBs but is byte-identity-only on
        # synthetic content. Nothing crossed "the true frame size differs from
        # the encode grid" with "does the encoder's own recon still equal a
        # conforming decoder's" — which is how issue #15's 67 divergent cells,
        # including a real encoder/decoder PREDICTION MISMATCH, stayed silent.
        #
        # 74 cells in `fast` mode: every residue mod 8 on each axis
        # independently, dims straddling 64 by +-1 and odd amounts, odd dims
        # (ceiling chroma), a POISONED padded luma stride, bd8 + bd10, and
        # `screen` content at the q55/preset-4..6 corner where the palette
        # search actually reaches a straddling block. Two oracles per cell:
        # byte-identity to C AND encoder-recon == aomdec.
        #
        # Teeth PROVEN by reverting each of the four fixes it guards, one at a
        # time (benchmarks/alignment_gate_teeth_2026-08-14.md): 74/74 ->
        # 68/74, 70/74, 70/74, 71/74. `ALIGN_GATE_MODE=full` adds preset and
        # qp breadth over the same shapes; run it locally after any change to
        # frame geometry, padding, the deblock/CDEF/LR extents, or the intra
        # reference edges.
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/alignment_gate.sh

      - name: tile identity — rows AND columns (8-bit)
        working-directory: rust
        # 29 cells across TileRowsLog2 x TileColsLog2 on divisible and ragged
        # SB grids, each asserting the C oracle's bytes actually CHANGED under
        # the tile request (anti-vacuity: both log2s clamp to the geometry, so
        # an unhonourable request silently yields a single-tile encode) and
        # that aomdec accepts the port's stream.
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/tile_gate.sh

      - name: SB128 identity — allintra M0/M1 above 240p (8-bit)
        working-directory: rust
        # 22 cells. Each asserts the oracle really emitted a 128px superblock,
        # so a mis-sized cell fails loudly instead of silently testing SB64.
        # The four gb82-sc `codec_wiki` SB128 cells dropped with a loud warning
        # while the corpus was absent here; since 2026-09-05 this job fetches
        # gb82-sc, so `corpus_dir` resolves and those four asserted byte-exact
        # cells RUN (18 -> 22 cells; measured both ways with SC_CORPUS).
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/sb128_gate.sh

      - name: arbitrary-size robustness — panic-free + decodable
        working-directory: rust
        # 128 cells (gradient AND screen) x arbitrary/odd/partial/sub-64 dims.
        # This is the gate that must catch a crash on the public API. It ran
        # gradient-only until 2026-08-03, so palette and IntraBC were switched
        # off in every cell — and it sailed past two real OOB panics that the
        # 8-bit identity gate then found on a 32x32 SCREEN frame.
        # A refusal (typed error, exit 3) is reported separately from a crash.
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/arbitrary_size_robustness.sh

      - name: feature-combination identity — SB128 x tiles, bd10 x tiles (8-bit + 10-bit)
        working-directory: rust
        # Issue #8 item 7 (the corpus-free gates belong in CI). The gate's
        # third axis (real content x tiles) needs BOTH the CID22 and gb82-sc
        # corpora. gb82-sc is fetched by this job as of 2026-09-05; CID22-512 is
        # 94 MB / 250 images and is NOT, so the `real` axis stays off and is
        # still unguarded in CI — a documented gap, not a silent one. CC_AXES
        # makes that a CALLER decision, visible here, rather than a silent
        # in-script skip. Axes 1-2 are 28 cells,
        # four encodes each (port/C x tiled/single) plus aomdec on the tiled
        # stream; byte-exact cells are asserted and diverging ones are pinned
        # self-promotingly (a pinned cell that starts matching FAILS the gate
        # so the improvement is recorded).
        run: |
          CC_AXES="sb128 bd10" AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" \
            ./tools/coverage_combos_gate.sh

      - name: coded-lossless identity + lossless decode (QP 0, issue #5)
        working-directory: rust
        # Two oracles per cell: byte-identity to C at qp 0 AND the reference
        # decoder's output == the source planes (the property the CodedLossless
        # header promises, and the one the pre-chunk-2 encoder violated).
        # Textured content at presets 0..3 is PINNED (lossless in both
        # encoders, an RD-decision residual) and self-promotes. CI runs the
        # 64x64 + partial-SB 96x80 geometries (72 cells); the 128x128 /
        # 200x136 twins are local (`tools/lossless_gate.sh`, 144 cells,
        # benchmarks/lossless_gate_2026-08-28.md).
        #
        # SCREEN CONTENT is a SECOND invocation with a narrower preset range,
        # not an extra content in the first. Added 2026-09-03 with the lift of
        # the blanket "QP 0 with screen-content tools" refusal: presets 6..13
        # are byte-identical to C (48/48 locally over {screen, screenrep} x
        # {64x64, 128x128, 96x80, 200x136}), preset 5 diverges on `screenrep`,
        # and presets 0..4 PANIC in intrabc_hash at QP 0 — so the refusal
        # survives below 6 and is pinned from the other side by
        # `regression_spotcheck.sh`'s two `qp0-screen-refused-*` cells. Folding
        # screen into the first run's preset ladder would just fail on the
        # refused cells; asserting the refusal is the gate for those.
        run: |
          LL_DIMS="64x64 96x80" AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" \
            ./tools/lossless_gate.sh
          LL_CONTENTS="screen screenrep" LL_DIMS="64x64 96x80" \
            LL_PRESETS="6 7 8 9 10 13" \
            AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" \
            ./tools/lossless_gate.sh

      - name: superres identity + conformance (chunk B.3)
        working-directory: rust
        # Byte-parity vs C at SUPERRES_FIXED + decodability at the UPSCALED
        # size under the reference decoder (the upscale is normative).
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/superres_gate.sh

      - name: Recon parity (encoder recon == aomdec output, byte-exact)
        working-directory: rust
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/recon_parity.sh

      - name: Variance-boost delta-q recon parity (mainline, tune IQ)
        working-directory: rust
        # The default recon-parity matrix never signals per-SB delta-q
        # (tune PSNR => enable_variance_boost false), so it cannot see a
        # delta-q desync. This cell arms tune IQ at qp >= 20 so
        # delta_q_res >= 2 and checks that every planned SB qindex survives
        # the pack's truncating (cur-prev)/delta_q_res against the decoder's
        # prev + reduced*delta_q_res accumulator. Fails vacuous runs (exit 2).
        run: |
          AOMDEC="$GITHUB_WORKSPACE/aom-build/aomdec" ./tools/variance_boost_recon.sh

      # Performance ratchet intentionally NOT run here: shared runners are
      # too noisy for the <=1.20x wall-time gate; it runs on the fixed HW
      # matrix (see benchmarks/*.meta for the current measured baselines).

  pure-rust:
    name: pure-Rust tier (${{ matrix.name }})
    # Issue #4 phase 4: the product crates carry no C, so they must build and
    # pass their C-free tests on every platform the CI policy names —
    # windows-11-arm, macOS Intel, i686 — with no cmake and no C toolchain.
    # The tier is the `zenav1-svt` facade: its dev graph has NO cref
    # dependency (`cargo tree -p zenav1-svt -e dev,normal | grep cref` is
    # empty), so `cargo test -p zenav1-svt` runs the e2e / golden-parity /
    # SIMD-tier-invariance / issue-repro suites and links no C oracle. The
    # differential + gate tier above stays x86-64 Linux, where the oracle is
    # built. A byte-exact encoder that only ever ran on one ISA family has not
    # been shown to be byte-exact.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-11-arm, os: windows-11-arm }
          - { name: macos-15-intel, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # No corpus and no reference decoder on these runners. Both skips are
      # made HERE, visibly (workflow -> env -> test) — never inside a test.
      ZENAV1_SKIP_CORPUS_TESTS: "1"
      ZENAV1_SKIP_DECODER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build every product crate (no C toolchain, cref excluded)
        working-directory: rust
        run: cargo build --workspace --exclude zenav1-svt-cref
      - name: Facade tests (e2e, golden parity, SIMD tier invariance, issue repros)
        working-directory: rust
        run: |
          cargo test -p zenav1-svt --no-fail-fast
          cargo test -p zenav1-svt --doc

  pure-rust-i686:
    name: pure-Rust tier (i686-unknown-linux-gnu via cross)
    # 32-bit is a primary target: pointer-width and usize-overflow bugs in a
    # frame-sized-buffer encoder only show up here (and in WASM).
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ZENAV1_SKIP_CORPUS_TESTS: "1"
      ZENAV1_SKIP_DECODER_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build every product crate for i686 (cref excluded)
        working-directory: rust
        run: cross build --workspace --exclude zenav1-svt-cref --target i686-unknown-linux-gnu
      - name: Facade tests on i686
        working-directory: rust
        run: cross test -p zenav1-svt --target i686-unknown-linux-gnu --no-fail-fast
