[workspace]
members = [
    "crates/svtav1-types",
    "crates/svtav1-dsp",
    "crates/svtav1-encoder",
    "crates/svtav1-cref",
    "crates/svtav1-target",
    "svtav1",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"
repository = "https://github.com/imazen/zenav1-svt"

[workspace.dependencies]
# Package names carry the `zenav1-svt-` prefix; each crate keeps a SHORT
# `[lib] name` (`svtav1_types`, ...) so interior `use svtav1_types::…` paths
# stay stable across the rename.
zenav1-svt-types = { path = "crates/svtav1-types" }
zenav1-svt-dsp = { path = "crates/svtav1-dsp" }
zenav1-svt-encoder = { path = "crates/svtav1-encoder" }

archmage = "0.9.29"
magetypes = "0.9.29"

# Production-hardening deps (additive; success/default path is byte-inert):
# cooperative cancellation (`enough`/`almost-enough`) + error-location
# tracing (`whereat`). `enough`/`whereat` stay no_std (default-features off);
# `almost-enough` keeps its default `std` feature to expose `StopToken`.
enough = { version = "0.4.4", default-features = false }
almost-enough = "0.4.4"
whereat = { version = "0.1.5", default-features = false }
# Stack-backed temporaries for the mode-decision hot path. heaptrack on the
# canonical cell: 84.9 % of the port's 6,851,798 allocations are <= 128 B,
# against C's 466,395 total -- churn, not footprint (the port's PEAK heap is
# 25.4 M against C's 69.4 M). `union` stores the inline array and the heap
# pointer in one union rather than side by side, which is what keeps a
# SmallVec the same size as a Vec for the capacities used here.
smallvec = { version = "1.16.0", default-features = false, features = ["union", "const_generics"] }

# opt-3 + fat LTO + codegen-units=1: measured 2026-09-17 on i265 — the
# encoder↔dsp crate split made every hot kernel a cross-crate call, and
# only LTO inlines those back. gradient 512x512 q32 paired medians:
# p6 42.8 -> 39.5 ms (1.085x), p10 12.1 -> 11.6 ms (1.043x); byte-identical
# on every measured cell. Bit-exactness is unaffected: Rust does not
# auto-contract a*b+c into FMA without target-feature=+fma, so
# integer/float results are identical across opt-levels.
# Build cost: ~35 s vs ~7 s for the encoder crate — the price of the
# target being "faster than the C reference", not "compiles fastest".
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.test]
opt-level = 2
# Test binaries were 76-97% DWARF: one 60.1 MB binary held 9.8 MB of .text and
# 45.8 MB of .debug_*, re-emitted into each of the 182 test executables (5.62 GB
# per clean build, measured 2026-09-09). "line-tables-only" keeps .debug_line, so
# panic backtraces still carry file:line, and drops .debug_info/_loc/_str/_ranges.
# Safe for this repo's tooling: every profiler it documents (tools/mem_gate.sh,
# tools/mem_peak.sh, tools/perf_gate.sh, tools/perf_profile/*) builds --release,
# not the test profile, so none of them reads this DWARF.
debug = "line-tables-only"

[profile.test.package."*"]
opt-level = 3

[profile.release.package."*"]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# DSP functions inherently need many parameters (src, stride, ref, stride, width, height, etc.)
too_many_arguments = "allow"
# Transform butterfly loops use index arithmetic matching C source exactly
needless_range_loop = "allow"
# OBU header tests use binary literals for readability
unusual_byte_groupings = "allow"

# SIMD primitives used by the port are published in archmage/magetypes 0.9.29.
