[package]
name = "zenav1-svt-dsp"
version = "0.1.0"
description = "Transforms, prediction, filtering — SIMD hot path for SVT-AV1 Rust port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "svtav1_dsp"

[dependencies]
zenav1-svt-types = { workspace = true }
archmage = { workspace = true }
magetypes = { workspace = true }

[dev-dependencies]
archmage = { workspace = true, features = ["testable_dispatch"] }
zenbench = "0.1.7"
zenav1-svt-cref = { path = "../svtav1-cref" }

[lints]
workspace = true

[features]
# `avx512` is DEFAULT-ON on purpose. It does not force AVX-512 on anyone: it
# only makes archmage's `X64V4Token` exist, so `incant!`'s `v4(cfg(avx512))`
# arm is COMPILED. Whether that arm RUNS is decided at run time by
# `X64V4Token::summon()` (CPUID), so a binary built with this feature is
# correct on a CPU without AVX-512 — it takes `_v3`. Turning it off would
# silently delete the tier on the machines that have it, which is exactly the
# "a tier that never executes" failure this repo keeps paying for.
default = ["avx512"]
avx512 = ["archmage/avx512", "magetypes/avx512"]
std = ["zenav1-svt-types/std"]
unchecked_dsp = []

# `perf_report` uses `svtav1_dsp::bench`, which is `#[cfg(feature = "std")]`.
# Without this, a bare `cargo test -p zenav1-svt-dsp` fails to BUILD the
# example (the workspace-wide run only worked because feature unification
# turned `std` on). Declaring the requirement makes the per-package run work.
[[example]]
name = "perf_report"
required-features = ["std"]

[[bench]]
name = "kernel_tiers"
harness = false
