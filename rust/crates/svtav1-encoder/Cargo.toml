[package]
autotests = false
name = "zenav1-svt-encoder"
version = "0.1.0"
description = "Mode decision, rate control, encoding loop, and pipeline for SVT-AV1 Rust port"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "svtav1_encoder"

[dependencies]
zenav1-svt-types = { workspace = true }
zenav1-svt-dsp = { workspace = true }
# The range coder / CDF tables / OBU writer live in `src/entropy/` (folded in
# from the former zenav1-svt-entropy crate, issue #3); archmage + magetypes are
# its SIMD coefficient-context kernels.
archmage = { workspace = true }
magetypes = { workspace = true }
# Feature 1: cooperative cancellation (`Stop` trait + no-op `Unstoppable` +
# type-erased `StopToken`). Feature 2: error-location tracing (`at!`).
enough = { workspace = true }
almost-enough = { workspace = true }
whereat = { workspace = true }
smallvec = { workspace = true }

[dev-dependencies]
zenav1-svt-cref = { path = "../svtav1-cref" }
# `testable_dispatch` exposes for_each_token_permutation for the entropy
# coefficient-context c_parity tests (all SIMD tiers vs C).
archmage = { workspace = true, features = ["testable_dispatch"] }

[lints]
workspace = true

[features]
default = ["std", "avx512"]
std = ["zenav1-svt-types/std", "zenav1-svt-dsp/std"]
# Same rationale as zenav1-svt-dsp's `avx512` feature: default-on so the `_v4`
# arms this crate's `incant!` lists name are actually compiled; whether they
# RUN is a run-time `X64V4Token::summon()` (CPUID) decision.
avx512 = ["archmage/avx512", "magetypes/avx512", "zenav1-svt-dsp/avx512"]
unsafe_encoding = ["zenav1-svt-dsp/unchecked_dsp", "unchecked_entropy"]
# Bounds-check elision in the entropy coder hot loops (former entropy-crate feature).
unchecked_entropy = []
# Prints every symbol written to stderr — for differential debugging against
# a gdb-instrumented reference decoder / the identity harness. Requires std.
symtrace = ["std"]
# Feature 3: forward fallible allocation to svtav1-types (parallels the
# std forwarding above).
fallible-alloc = ["zenav1-svt-types/fallible-alloc"]
# Expert-only encoder controls that have NO C-parity claim and are not part of
# the stable surface (double-underscore prefix: do not depend on this in
# production code; fields may change without a semver bump). Currently:
# `EncodePipeline::chroma_q_override` — fixed per-plane chroma delta-q for
# decorrelated-plane research stimuli (chroma_q.rs `ChromaQOverride`).
__expert = []
# Lifts the per-module `allow(dead_code)` in lib.rs so
# tools/dead_code_ledger.py can list the items only the parity tests call
# (docs/DEAD-CODE.tsv, plan T2). Never enable it in a build that ships.
__dead_code_audit = []

[[test]]
name = "c_parity_entropy"
path = "tests/c_parity_entropy.rs"

[[test]]
name = "c_parity_sc_detect"
path = "tests/c_parity_sc_detect.rs"

[[test]]
name = "fp_determinism"
path = "tests/fp_determinism.rs"

[[test]]
name = "c_parity_tpl_neigh"
path = "tests/c_parity_tpl_neigh.rs"

