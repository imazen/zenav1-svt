[package]
autotests = false
name = "zenav1-svt"
version = "0.1.0"
description = "Safe Rust AV1 encoder — algorithm-for-algorithm port of SVT-AV1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "svtav1"

[dependencies]
zenav1-svt-types = { workspace = true, features = ["std"] }
zenav1-svt-dsp = { workspace = true, features = ["std"] }
zenav1-svt-encoder = { workspace = true }

# Container support requires Rust 1.93 through the serializer; the default
# raw-AV1 build retains the workspace's Rust 1.98 minimum.
zenavif-serialize = { version = "0.2.0", git = "https://github.com/imazen/zenavif", rev = "98c8a5011e1ac573770a8889a8b5a4a68587de90", optional = true }

[dev-dependencies]
enough = { workspace = true }
# PNG decode for the real-image identity harness (examples/identity_run.rs
# `file:<path.png>` content). Example-only — not linked into the library.
png = "0.18.1"
# GIF decode for the `gif_to_avif` example: pure Rust, forbids unsafe, and
# composites disposal/transparency itself so the example does not have to.
# Example-only -- not linked into the library.
zengif = { version = "0.7.3", default-features = false, features = ["std"] }
# Container parser for `tests/animation_e2e.rs`: the animated-AVIF assertions
# parse the file this crate just wrote with an INDEPENDENT parser rather than
# inspecting the encoder's own state. Dev-only.
zenavif-parse = { version = "0.6.2", features = ["eager"] }
# MP4 demux for the `mp4_to_avif` example. `re_mp4` carries exactly ONE
# `unsafe` in the whole crate (`CStr::from_bytes_with_nul_unchecked` in
# `emsg.rs`, a box this path never parses); no MP4 parser on crates.io is
# unsafe-free except a v0.0.x plugin shape. Dev-only, so the product library
# path stays unsafe-free.
re_mp4 = "0.5.1"
# Pure-Rust H.264 decode for the same example: `forbid(unsafe_code)` codec
# core, decoder validated bit-exact against Cisco `h264dec` over openh264's
# conformance corpus, BSD-2. `default-features = false` selects the scalar
# tree with NO unsafe anywhere; enable the default features for its portable
# SIMD if throughput matters more than that.
rusty_h264 = { version = "0.16.0", default-features = false, features = ["std", "global-alloc"] }
# `testable_dispatch` exposes for_each_token_permutation, which tests/
# tier_invariance.rs uses to walk EVERY SIMD tier and assert the encoder emits
# identical bytes on each. Cargo unifies the feature across the graph, so this
# also enables it for the dsp/encoder crates' archmage -- which is what makes an
# END-TO-END encode observe the disabled tiers rather than only this crate.
# Dev-only: no release build carries it.
archmage = { workspace = true, features = ["testable_dispatch"] }
zenav1-svt-encoder = { workspace = true }

[lints]
workspace = true

[features]
default = ["std"]
avif-container = ["dep:zenavif-serialize"]
std = []
unsafe_encoding = ["zenav1-svt-encoder/unsafe_encoding"]
# Per-symbol arithmetic-coder trace on stderr (identity harness:
# tools/identity_diff.sh diffs it against the wrapped C library's trace).
symtrace = ["zenav1-svt-encoder/symtrace"]
# Feature 3: forward fallible allocation down to the encoder/types so the
# gates (e.g. golden_parity) can be run with `--features fallible-alloc`.
fallible-alloc = ["zenav1-svt-encoder/fallible-alloc"]

[[test]]
# Animated AVIF had no test anywhere in the workspace until 2026-09-11; this
# encodes and then PARSES THE RESULT BACK with an independent container parser.
name = "animation_e2e"
path = "tests/animation_e2e.rs"

[[test]]
name = "svtav1_suite"
path = "tests/svtav1_suite.rs"

[[test]]
name = "odd_frame_recon"
path = "tests/odd_frame_recon.rs"

[[test]]
name = "still_policy"
path = "tests/still_policy.rs"

[[test]]
name = "tier_invariance"
path = "tests/tier_invariance.rs"

[[test]]
name = "configuration_support"
path = "tests/configuration_support.rs"

[[test]]
name = "e2e_correctness"
path = "tests/e2e_correctness.rs"

[[test]]
name = "golden_parity"
path = "tests/golden_parity.rs"

[[test]]
name = "hdr_fork_e2e"
path = "tests/hdr_fork_e2e.rs"

[[test]]
name = "issue11_repro"
path = "tests/issue11_repro.rs"

[[test]]
name = "issue13_repro"
path = "tests/issue13_repro.rs"

[[test]]
name = "issue18_repro"
path = "tests/issue18_repro.rs"

[[test]]
name = "issue9_repro"
path = "tests/issue9_repro.rs"

[[test]]
name = "real_encode"
path = "tests/real_encode.rs"

[[test]]
name = "thread_determinism"
path = "tests/thread_determinism.rs"

# The GIF -> animated AVIF example needs the container muxer; without the
# feature the `rgba` module and `encode_rgba_animation` are compiled out, so a
# default-feature workspace build must skip the example rather than fail on it.
[[example]]
name = "gif_to_avif"
required-features = ["avif-container"]

[[example]]
name = "mp4_to_avif"
required-features = ["avif-container"]
